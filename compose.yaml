services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aayatra
      POSTGRES_PASSWORD: aayatra_dev_only
      POSTGRES_DB: aayatra_sales
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aayatra -d aayatra_sales"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pg_data:
